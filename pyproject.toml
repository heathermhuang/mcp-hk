[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-hk"
version = "0.4.0a1"
description = "Hong Kong public data over MCP and HTTP, extending mcp-open-data-hk"
readme = "README.md"
authors = [{name = "Tony Chan", email = "chankwongyintony@gmail.com"}]
license = {text = "MIT"}
dependencies = [
    "fastmcp==2.14.7",
    "httpx==0.28.1",
    "fastapi==0.143.2",
    "pydantic==2.14.1",
    "uvicorn==0.54.0",
    "defusedxml==0.7.1",
    "openpyxl==3.1.5",
    "xlrd==2.0.2",
    "pypdf==6.12.0",
    "ijson==3.4.0.post0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10"

[project.optional-dependencies]
curated = ["psycopg[binary]==3.2.13"]

test = [
    "pytest==8.4.2",
    "pytest-asyncio==0.26.0",
]

dev = [
    "black==25.12.0",
    "flake8==7.4.1",
]

[project.scripts]
mcp-open-data-hk = "mcp_open_data_hk:main"
mcp-hk = "mcp_open_data_hk:main"
mcp-hk-http = "mcp_open_data_hk.api:main"
mcp-hk-refresh = "mcp_open_data_hk.ingest:main"
mcp-hk-catalogue = "mcp_open_data_hk.catalogue_cli:main"
mcp-hk-container = "mcp_open_data_hk.operations:main"
mcp-hk-curated-backend = "mcp_open_data_hk.curated.backend:main"
mcp-hk-curated = "mcp_open_data_hk.curated.cli:main"
mcp-hk-enigma-audit = "mcp_open_data_hk.archive_audit:main"

[project.urls]
Homepage = "https://mcp.hk"
Repository = "https://github.com/heathermhuang/mcp-hk"
Issues = "https://github.com/heathermhuang/mcp-hk/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
markers = ["live: optional government network integration probes"]

[tool.setuptools.package-data]
"mcp_open_data_hk.curated" = ["migrations/*.sql"]
mcp_open_data_hk = ["web/*.html", "web/*.css", "web/*.js", "web/*.json", "web/*.svg", "web/*.png", "web/*LICENSE*.txt", "web/*NOTICE*.txt", "source-relay-targets.json", "webb-site-NOTICE.txt"]
