[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-hk"
version = "0.3.0a1"
description = "Hong Kong public data over MCP and HTTP, extending mcp-open-data-hk"
readme = "README.md"
authors = [{name = "Tony Chan", email = "chankwongyintony@gmail.com"}]
license = {text = "MIT"}
dependencies = [
    "fastmcp==2.14.7",
    "httpx==0.28.1",
    "fastapi==0.143.2",
    "pydantic==2.14.1",
    "uvicorn==0.54.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10"

[project.optional-dependencies]
test = [
    "pytest>=6.0",
    "pytest-asyncio>=0.14.0",
]

dev = [
    "black>=22.0",
    "flake8>=4.0",
]

[project.scripts]
mcp-open-data-hk = "mcp_open_data_hk:main"
mcp-hk = "mcp_open_data_hk:main"
mcp-hk-http = "mcp_open_data_hk.api:main"
mcp-hk-refresh = "mcp_open_data_hk.ingest:main"

[project.urls]
Homepage = "https://mcp.hk"
Repository = "https://github.com/heathermhuang/mcp-hk"
Issues = "https://github.com/heathermhuang/mcp-hk/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
markers = ["live: optional government network integration probes"]

[tool.setuptools.package-data]
mcp_open_data_hk = ["web/*.html", "web/*.css", "web/*.js"]
