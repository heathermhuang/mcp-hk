# Dedicated host only; provision and fund it separately from the gateway.
services:
  postgres:
    image: postgres@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
    restart: unless-stopped
    environment:
      POSTGRES_DB: curated
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_admin_password
    secrets: [pg_admin_password]
    volumes: ["/srv/mcp-hk-curated/postgres:/var/lib/postgresql/data"]
    mem_limit: 2g
    cpus: 2
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "max_wal_size=512MB", "-c", "log_statement=none", "-c", "log_parameter_max_length=0", "-c", "log_parameter_max_length_on_error=0"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d curated"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build:
      context: ../..
      dockerfile: deploy/curated/Dockerfile
    restart: unless-stopped
    env_file: /etc/mcp-hk-curated/backend.env
    mem_limit: 512m
    cpus: 1
    depends_on:
      postgres:
        condition: service_healthy
  proxy:
    image: caddy@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    restart: unless-stopped
    environment:
      CURATED_HOSTNAME: ${CURATED_HOSTNAME:?Set the dedicated backend hostname}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/mcp-hk-curated/caddy:/data
    mem_limit: 128m
    depends_on: [backend]
secrets:
  pg_admin_password:
    file: /etc/mcp-hk-curated/pg-admin-password
